<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Shared alarm · AlarmGroups</title>
  <style>
    :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6c6c70; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 26rem; margin: 16px; padding: 28px 24px; background: var(--card); border-radius: 20px; text-align: center; }
    .icon { font-size: 44px; }
    h1 { font-size: 22px; margin: 8px 0; }
    p { color: var(--muted); margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⏰</div>
    <h1>Someone shared alarms with you</h1>
    <p>Open this link on an iPhone with AlarmGroups installed to add them.</p>
    <p>If it opened in Safari, tap and hold the link in Messages and choose “Open in AlarmGroups”.</p>
  </main>
</body>
</html>
